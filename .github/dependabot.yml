version: 2

# Weekly version-update PRs, grouped so a week's bumps arrive as one PR per ecosystem. Security updates (enabled in the repository
# settings) still open at once, one per advisory.
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # A release must be a week old before it is proposed: a compromised or yanked version is usually caught within days.
    cooldown:
      default-days: 7
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # EF Core and Microsoft.Extensions stay on 9.x until the Pomelo MySQL/MariaDB provider (the primary engine) ships for a newer
      # major (Directory.Build.props). A major bump of these must be a deliberate change, not a weekly PR.
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: [version-update:semver-major]
      - dependency-name: "Pomelo.EntityFrameworkCore.MySql"
        update-types: [version-update:semver-major]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # A release must be a week old before it is proposed: a compromised or yanked version is usually caught within days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Base images of apps/docker/Dockerfile, pinned by digest: one PR moves tag and digest together. The SDK tag must keep satisfying
  # global.json; docker-smoke.yml builds every target on the PR, so a bump that breaks the build cannot land green.
  - package-ecosystem: docker
    directory: "/apps/docker"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      dotnet-images:
        patterns: ["dotnet/*"]

  # Third-party images of docker-compose.yml (MariaDB, Prometheus, Grafana), pinned by digest.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # MariaDB stays on the 11.4 LTS series: a new major or minor is a deliberate database upgrade, not a weekly PR.
      - dependency-name: "mariadb"
        update-types: [version-update:semver-major, version-update:semver-minor]
