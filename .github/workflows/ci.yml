name: CI

on:
  push:
    branches: ["main", "integrate/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same ref cancels the older, now-stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Full suites run on pushes to main/integrate/** and on non-draft PRs only.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Each suite's test projects are a solution filter of ArcaneCore.slnx (tests/ci/*.slnf). Together they cover every
        # test project in the solution exactly once; ContributingGuideTests fails when a project is left out or doubled.
        suite: [Game, World, Data, Rest]

    name: test (${{ matrix.suite }})

    # The data-layer tests run against every supported engine (charter §2 + ROADMAP):
    # SQLite in-process, MariaDB and PostgreSQL as service containers.
    services:
      mariadb:
        image: mariadb:10.11@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
        env:
          MARIADB_ROOT_PASSWORD: arcane
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: arcane
          POSTGRES_PASSWORD: arcane
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U arcane"
          --health-interval=5s --health-timeout=5s --health-retries=30

    env:
      ARCANECORE_TEST_MARIADB: "Server=127.0.0.1;Port=3306;User=root;Password=arcane;"
      ARCANECORE_TEST_POSTGRES: "Host=127.0.0.1;Port=5432;Username=arcane;Password=arcane;"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: "preview"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '**/packages.lock.json', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ArcaneCore.slnx --locked-mode

      # Directory.Build.props sets TreatWarningsAsErrors=true, so a warning fails the build.
      # The whole solution is built in every job so warnings anywhere still fail CI.
      - name: Build
        run: dotnet build ArcaneCore.slnx -c Release --no-restore

      - name: Test
        # Projects within a job run serially: first-time EF fixture startup has a bounded
        # deadline and must not compete with the crypto suite and provider matrix.
        run: dotnet test tests/ci/${{ matrix.suite }}.slnf -c Release --no-build -m:1 --verbosity normal --logger trx --results-directory TestResults

      # The .trx results feed test-report.yml, which posts the summary on the PR (a workflow_run job, so a fork PR gets one too).
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.suite }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7

      - name: Native mock-client scenario
        if: matrix.suite == 'Rest'
        run: dotnet run --project tools/ArcaneCore.MockClient -c Release --no-build -- self-test
