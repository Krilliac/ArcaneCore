name: .NET

# A quick Release build of the whole solution on the CI SDK (warnings are errors via Directory.Build.props). The tests run in ci.yml's
# matrix, which starts the MariaDB and PostgreSQL services they need, so they are not repeated here.
on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: "preview"

      - name: Restore dependencies
        run: dotnet restore ArcaneCore.slnx --locked-mode

      - name: Build
        run: dotnet build ArcaneCore.slnx -c Release --no-restore
