name: .NET

# The quick release-build gate checks both supported frameworks independently using stable SDKs.
# Integration tests and release/deploy jobs retain their upstream .NET 11 settings.
on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Build .NET ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: 10
            dotnet_version: "10.0.x"
          - sdk: 11
            dotnet_version: "11.0.x"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET ${{ matrix.sdk }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ matrix.dotnet_version }}

      - name: Build and verify .NET ${{ matrix.sdk }} NuGet locks
        run: ./scripts/build-net${{ matrix.sdk }}.sh Release
