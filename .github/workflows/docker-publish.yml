name: Docker publish

# Builds the world, realm and tools images of apps/docker/Dockerfile for linux/amd64 and linux/arm64 and pushes them to the GitHub
# Container Registry, so a Docker VPS pulls them (docker-compose.prod.yml, docs/guide/docker.md) instead of building from source.
# It runs on a push to main (the rolling `edge` tag, Debug configuration like the live server and the nightly binaries), when a version
# tag v* is pushed (Release), and by hand (workflow_dispatch). A push that changes only docs/** or Markdown files is skipped (path
# filters are not evaluated for tag pushes, so a v* tag always builds).
# A pull request that changes the Dockerfile, the build props, a project file or a lock file (the inputs that decide what the image
# contains; C# source changes alone do not start it, docker-smoke builds the amd64 image from those) runs the same multi-arch build with
# push: false, so a linux/arm64 failure shows before the merge.
# Tags pushed per image: edge (push to main), sha-<7 hex> (push to main, Debug), the git tag (tag runs: only that tag, since the commit
# usually has its sha tag from the push to main already and a second Release push would overwrite it) and, for a hand run on a branch,
# only sha-<7 hex>-debug or sha-<7 hex>-release (an explicit suffix on that tag: an empty tag-level suffix would override the flavor
# suffix of docker/metadata-action and give the plain sha-<7 hex> of a push). A hand run on a v* tag is refused: it would re-push the
# release tag itself.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/docker/**"
      - ".dockerignore"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".editorconfig"
      - "**/*.csproj"
      - "**/packages.lock.json"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration baked into the images (tag runs are always Release, pushes to main always Debug)"
        type: choice
        options: [Release, Debug]
        default: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # packages: write is static on purpose (GitHub does not evaluate expressions in permissions). A pull request run still holds it, but
    # no step uses it there: the login is skipped, push is false and nothing writes the cache; a fork's token is read-only anyway.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [world, realm, tools]
    env:
      CONFIGURATION: ${{ inputs.configuration || (github.ref_type == 'tag' && 'Release' || 'Debug') }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Refuse a hand run on a version tag
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
        run: |
          echo "::error::Run this workflow on a branch. A hand run on a v* tag would re-push that release tag."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The registry path must be lower case; the owner of this repository is not.
      - name: Image name
        id: image
        env:
          TARGET: ${{ matrix.target }}
        run: echo "name=ghcr.io/${OWNER,,}/arcanecore-${TARGET}" >> "$GITHUB_OUTPUT"

      # arm64 runtime stages are tiny (a base image and a COPY); the compile runs natively (Dockerfile, --platform=$BUILDPLATFORM).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A pull request only builds: nothing is pushed, so it needs no login (and a fork's token could not write anyway).
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
            suffix=${{ inputs.configuration == 'Debug' && '-debug' || '' }}
          tags: |
            type=ref,event=tag
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.event_name == 'push' && github.ref_type == 'branch' }}
            type=sha,suffix=${{ inputs.configuration == 'Release' && '-release' || '-debug' }},enable=${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            CONFIGURATION=${{ env.CONFIGURATION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.target) || '' }}
