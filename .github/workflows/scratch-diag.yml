name: scratch-diag
concurrency:
  group: scratch-diag
  cancel-in-progress: true
on:
  push:
    branches: ["scratch/diag-1324"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: "preview"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '**/packages.lock.json', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Build
        run: dotnet build tests/ArcaneCore.World.Tests/ArcaneCore.World.Tests.csproj -c Release 2>&1 | tail -40 > build.log; tail -40 build.log
      - name: Test
        env:
          ARCANE_DIAG: "1"
        run: |
          dotnet test tests/ArcaneCore.World.Tests/ArcaneCore.World.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~PlayerbotGrindCampTests|FullyQualifiedName~PlayerbotWorldDestinationsTests|FullyQualifiedName~PlayerbotPvpUnreachableTests|FullyQualifiedName~PlayerbotRoutePlanWatchTests|FullyQualifiedName~PlayerbotDestinationAnomalyTests|FullyQualifiedName~PlayerbotNavigationAnomalyTests" \
            --logger "console;verbosity=normal" > test.log 2>&1 || true
          tail -5 test.log
      - name: Publish logs
        if: always()
        run: |
          mkdir -p out; cp build.log test.log out/ 2>/dev/null || true; cp /tmp/arcane-diag.log out/ 2>/dev/null || true
          cd out; git init -q; git checkout -q -b scratch/diag-results
          git -c user.name=ci -c user.email=ci@example.com add -A; git -c user.name=ci -c user.email=ci@example.com commit -qm "diag ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" scratch/diag-results
