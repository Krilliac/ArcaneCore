name: Codacy Security Scan

# Codacy Analysis CLI: runs Codacy's bundled security tools over the tree and uploads the findings to code scanning as SARIF. With the
# CODACY_PROJECT_TOKEN secret it uses the repository's Codacy configuration; without it (a fork PR, or no token set) the tools run with
# their default configurations. https://github.com/codacy/codacy-analysis-cli-action
on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "25 22 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # checkout
      actions: read # upload-sarif reads the run status
      security-events: write # upload-sarif
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Generates a SARIF file with the security issues found. The exit code is forced to 0 so the SARIF is always produced; code
      # scanning decides what blocks a PR.
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }} # zizmor: ignore[secrets-outside-env] -- optional analysis token, read-only use
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: results.sarif
          category: codacy
