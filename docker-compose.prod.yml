# Production compose for a Docker VPS (docs/guide/docker.md, "Deploying to a VPS"): the same services as docker-compose.yml, but the
# ArcaneCore images are PULLED from the registry that .github/workflows/docker-publish.yml pushes to (nothing is built on the VPS), and
# every service rotates its json-file log and restarts unless stopped.
#
#   cp apps/docker/.env.example .env      # then set the passwords, ARCANE_REALM_ADDRESS and ARCANE_IMAGE_TAG
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# ARCANE_IMAGE_TAG is required (no default: a VPS must say which release it runs): the git tag the publish workflow was run for
# (for example v0.3.0), or sha-<7 hex> for a manual run. ARCANE_IMAGE_REPO is the registry path the images live under; the default
# is this repository's owner, change it only for a fork's images.
#
# Keep this file and docker-compose.yml in step: same services, environment keys and ports (docker-smoke.yml validates both).
# The files it mounts from the checkout (apps/docker/db-init, apps/docker/prometheus.yml, apps/docker/grafana, docs/ops/grafana)
# come from the same git tag as the images, so check the repository out at that tag on the VPS.

x-arcane-db: &arcane-db
  Database__Provider: MariaDb

# Rotate the container log so a long-running daemon cannot fill the VPS disk: 5 files of 10 MB per service.
x-arcane-logging: &arcane-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  arcane-database:
    container_name: arcane-database
    image: mariadb:11.4@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
    networks: [arcane-network]
    ports:
      - ${DOCKER_DB_EXTERNAL_BIND:-127.0.0.1}:${DOCKER_DB_EXTERNAL_PORT:-3306}:3306
    environment:
      MARIADB_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?set DOCKER_DB_ROOT_PASSWORD in .env (apps/docker/.env.example)}
      MARIADB_USER: ${DOCKER_DB_USER:?set DOCKER_DB_USER in .env (apps/docker/.env.example)}
      MARIADB_PASSWORD: ${DOCKER_DB_PASSWORD:?set DOCKER_DB_PASSWORD in .env (apps/docker/.env.example)}
    volumes:
      - ${DOCKER_VOL_DB:-arcane-database}:/var/lib/mysql
      - ./apps/docker/db-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    logging: *arcane-logging
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 10s
      retries: 40

  arcane-realm:
    container_name: arcane-realm
    image: ${ARCANE_IMAGE_REPO:-ghcr.io/krilliac}/arcanecore-realm:${ARCANE_IMAGE_TAG:?set ARCANE_IMAGE_TAG in .env (docs/guide/docker.md, Deploying to a VPS)}
    pull_policy: always
    networks: [arcane-network]
    restart: unless-stopped
    logging: *arcane-logging
    environment:
      <<: *arcane-db
      Database__ConnectionString: "Server=arcane-database;Port=3306;Database=arcanecore_auth;User=${DOCKER_DB_USER:?set DOCKER_DB_USER in .env (apps/docker/.env.example)};Password=${DOCKER_DB_PASSWORD:?set DOCKER_DB_PASSWORD in .env (apps/docker/.env.example)};"
      # The address the client is sent to for the world: the VPS's public IP and port 8085.
      Realms__Seed__0__Name: ${ARCANE_REALM_NAME:-ArcaneCore}
      Realms__Seed__0__Address: ${ARCANE_REALM_ADDRESS:-127.0.0.1:8085}
      Ops__Watchdog__Heartbeat__Mode: Stdout
      Ops__Metrics__Enabled: ${ARCANE_METRICS_ENABLED:-false}
      Ops__Metrics__RealmPrometheusPrefix: "http://+:9465/metrics/" # the Realm reads its own key (docs/ops/metrics.md)
    ports:
      - ${DOCKER_REALM_EXTERNAL_PORT:-3724}:3724
    # Logs live in a named volume: it takes the image's ownership (uid 1000), so no host directory needs a chown.
    volumes:
      - arcane-logs:/arcanecore/logs
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3724"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      arcane-database:
        condition: service_healthy

  arcane-world:
    container_name: arcane-world
    image: ${ARCANE_IMAGE_REPO:-ghcr.io/krilliac}/arcanecore-world:${ARCANE_IMAGE_TAG:?set ARCANE_IMAGE_TAG in .env (docs/guide/docker.md, Deploying to a VPS)}
    pull_policy: always
    networks: [arcane-network]
    stdin_open: true
    tty: true
    restart: unless-stopped
    logging: *arcane-logging
    stop_grace_period: 90s # the save drain (HostOptions:ShutdownTimeout is 60 s)
    environment:
      <<: *arcane-db
      Database__Auth__ConnectionString: "Server=arcane-database;Port=3306;Database=arcanecore_auth;User=${DOCKER_DB_USER:?set DOCKER_DB_USER in .env (apps/docker/.env.example)};Password=${DOCKER_DB_PASSWORD:?set DOCKER_DB_PASSWORD in .env (apps/docker/.env.example)};"
      Database__Characters__ConnectionString: "Server=arcane-database;Port=3306;Database=arcanecore_characters;User=${DOCKER_DB_USER:?set DOCKER_DB_USER in .env (apps/docker/.env.example)};Password=${DOCKER_DB_PASSWORD:?set DOCKER_DB_PASSWORD in .env (apps/docker/.env.example)};"
      Database__World__ConnectionString: "Server=arcane-database;Port=3306;Database=arcanecore_world;User=${DOCKER_DB_USER:?set DOCKER_DB_USER in .env (apps/docker/.env.example)};Password=${DOCKER_DB_PASSWORD:?set DOCKER_DB_PASSWORD in .env (apps/docker/.env.example)};"
      # Client data extracted by you (nothing ships): dbc/, maps/, vmaps/, mmaps/ under DOCKER_VOL_DATA.
      ClientData__DbcDirectory: /arcanecore/data/dbc
      World__Maps__DataDirectory: /arcanecore/data
      Ops__Watchdog__Heartbeat__Mode: Stdout
      Ops__Metrics__Enabled: ${ARCANE_METRICS_ENABLED:-false}
      Ops__Metrics__PrometheusPrefix: "http://+:9464/metrics/"
      Ops__Metrics__Realm: ${ARCANE_REALM_NAME:-ArcaneCore}
    ports:
      - ${DOCKER_WORLD_EXTERNAL_PORT:-8085}:8085
    volumes:
      - ${DOCKER_VOL_DATA:-./env/data}:/arcanecore/data:ro
      - arcane-logs:/arcanecore/logs
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s
    depends_on:
      arcane-database:
        condition: service_healthy
      arcane-realm:
        condition: service_started

  # One-shot tools: docker compose -f docker-compose.prod.yml --profile tools run --rm arcane-tools --help
  # Accounts: ... run --rm --entrypoint dotnet arcane-tools /arcanecore/account/arcane-account.dll create <name>
  arcane-tools:
    container_name: arcane-tools
    image: ${ARCANE_IMAGE_REPO:-ghcr.io/krilliac}/arcanecore-tools:${ARCANE_IMAGE_TAG:?set ARCANE_IMAGE_TAG in .env (docs/guide/docker.md, Deploying to a VPS)}
    pull_policy: always
    profiles: [tools]
    networks: [arcane-network]
    logging: *arcane-logging
    environment:
      <<: *arcane-db
      Database__ConnectionString: "Server=arcane-database;Port=3306;Database=arcanecore_auth;User=${DOCKER_DB_USER:?set DOCKER_DB_USER in .env (apps/docker/.env.example)};Password=${DOCKER_DB_PASSWORD:?set DOCKER_DB_PASSWORD in .env (apps/docker/.env.example)};"
      Database__World__ConnectionString: "Server=arcane-database;Port=3306;Database=arcanecore_world;User=${DOCKER_DB_USER:?set DOCKER_DB_USER in .env (apps/docker/.env.example)};Password=${DOCKER_DB_PASSWORD:?set DOCKER_DB_PASSWORD in .env (apps/docker/.env.example)};"
    volumes:
      - ${DOCKER_VOL_IMPORT:-./env/import}:/arcanecore/import
    depends_on:
      arcane-database:
        condition: service_healthy

  # Optional monitoring (docs/ops/metrics.md): docker compose -f docker-compose.prod.yml --profile monitoring up -d, with
  # ARCANE_METRICS_ENABLED=true. Both listen on 127.0.0.1 of the VPS: reach them through an SSH tunnel, never a public port.
  prometheus:
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    profiles: [monitoring]
    networks: [arcane-network]
    restart: unless-stopped
    logging: *arcane-logging
    volumes:
      - ./apps/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - ${DOCKER_PROMETHEUS_EXTERNAL_BIND:-127.0.0.1}:${DOCKER_PROMETHEUS_EXTERNAL_PORT:-9090}:9090

  grafana:
    image: grafana/grafana:11.4.0@sha256:d8ea37798ccc41061a62ab080f2676dda6bf7815558499f901bdb0f533a456fb
    profiles: [monitoring]
    networks: [arcane-network]
    restart: unless-stopped
    logging: *arcane-logging
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./apps/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/ops/grafana:/var/lib/grafana/dashboards:ro
    ports:
      - ${DOCKER_GRAFANA_EXTERNAL_BIND:-127.0.0.1}:${DOCKER_GRAFANA_EXTERNAL_PORT:-3000}:3000

volumes:
  arcane-database:
  arcane-logs:

networks:
  arcane-network:
